# @package _global_
# Pretrained Mol-JEPA encoder + readout head, fine-tuned on readout head.
defaults:
  - override /readout: mlp

model:
  name: mol_jepa
  type: mol_jepa
  freeze_encoder: True
  readout_lr: 1.0e-3
  readout_input_dim: 6144 # 512 | 6144

train:
  epochs: 20
  batch_size: 8
  weight_decay: 1.0e-4
  grad_clip: 1.0
